name: QUANT NOVA 3.3.4 R1 GHCR Build

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build-nova.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bbblaprk-svg/kiwoom-smartmoney-daytrader

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push QUANT NOVA 3.3.4 R1
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nova-3.3.4-r1
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Show published image
        run: |
          echo "Published:"
          echo "${REGISTRY}/${IMAGE_NAME}:latest"
          echo "${REGISTRY}/${IMAGE_NAME}:nova-3.3.4-r1"
